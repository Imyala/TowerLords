// shrine shapes) now has a real, readable model. All builders honour the engine contract the enemy
// families already use: ONE root node in userData.body (bob / hit-flash / telegraph / tint drive it),
// userData.humanoid = face the heading, userData.arms / userData.legs = walk-swing, and an optional
// userData.anim list of self-animating parts that apAnimateParts() advances every frame.

// marble / ash with a worn path through the corridors), natural boundaries instead of neon-trimmed boxes (cliff
// boulders, basalt columns, ice blocks, void cliffs, marble balustrades, bone walls), a terrain that rolls away to
// mountains on the horizon, water or lava that actually moves, and weather in the air. Nothing here touches
// gameplay: the collision grid, spawns and pathing are untouched — the world is dressed around them.

// per-frame: weather drifts around the player, water ripples, live scenery animates
function updateLandscape(dt){ _AP.t+=dt; const P=_AP.particles;
  let fx=0,fz=0; try{ const pl=(typeof _G!=='undefined')&&_G.players&&_G.players[0]; if(pl&&pl.player){ fx=pl.player.position.x; fz=pl.player.position.z; } }catch(_){}
  if(_AP.sky){ _AP.sky.position.set(fx,0,fz); }
  if(P){ const a=P.pts.geometry.attributes.position.array, v=P.vel, t=_AP.t;
    for(let i=0;i<P.N;i++){ const j=i*3; a[j]+=v[j]*dt+Math.sin(t*.7+i)*dt*(P.k==='snow'?.9:.4); a[j+1]+=v[j+1]*dt; a[j+2]+=v[j+2]*dt;
      if(P.k==='mote'||P.k==='spore'||P.k==='dust'){ a[j+1]+=Math.sin(t*.9+i*.3)*dt*.6; }
      let dx=a[j]-fx, dz=a[j+2]-fz; if(dx>55)a[j]-=110; else if(dx<-55)a[j]+=110; if(dz>55)a[j+2]-=110; else if(dz<-55)a[j+2]+=110;
      if(a[j+1]>30) a[j+1]=0; else if(a[j+1]<0) a[j+1]=30; }
    P.pts.geometry.attributes.position.needsUpdate=true; }
  if(_AP.water&&_AP.water.material.map){ _AP.water.material.map.offset.x+=dt*.012; _AP.water.material.map.offset.y+=dt*.008; if(_AP.water.userData.lava) _AP.water.material.emissiveIntensity=1.25+Math.sin(_AP.t*1.3)*.2; }
  for(const o of _AP.live){ if(o.userData&&o.userData.anim) apAnimateParts(o,dt); }
  if(typeof G!=='undefined'){ for(const st of [G.stashStation,G.vendorStation,G.craftStation,G.yardStation,G.scoreStation,G.yardTerminal,G.portal]){ if(st&&st.mesh&&st.mesh.userData.anim) apAnimateParts(st.mesh,dt); }
    for(const list of [G.shrines,G.vistas,G.heroChallenges,G.pois,G.chests,G.townNpcs]){ if(!list) continue; for(const it of list){ const m=it&&it.mesh; if(m&&m.userData&&m.userData.anim) apAnimateParts(m,dt); } }
    if(G.scenery) for(const sc of G.scenery){ if(sc.userData&&sc.userData.anim) apAnimateParts(sc,dt); } }
}
