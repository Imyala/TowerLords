function apFacePet(pm,dt){ const u=pm.userData; const b=u.body; if(!b) return;

// ============================================================ ART PASS — LANDSCAPE
// The tower's floors used to be flat coloured slabs on a black void with a grid drawn over them. Every floor now
// sits inside a real landscape: procedurally textured ground and walls, a rolling low-poly terrain beyond the walls
// dressed in each biome's own life (forest, lava fields, glaciers, void islands, gilded gardens, bone dunes), a ring
// of distant silhouettes in the fog, water / lava / abyss planes, and a drifting particle field (spores, embers,
// snow, void motes, gold dust, ash). Nothing here touches gameplay — the outer terrain never overlaps a walkable
// cell, so collision, pathing and spawns are exactly as before.
// ---- value noise (seedable, deterministic) ----
function apHash(x,y,seed){ let h=(x*374761393 + y*668265263 + (seed||0)*974634121)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }

  const a=apHash(xi,yi,seed), b=apHash(xi+1,yi,seed), c=apHash(xi,yi+1,seed), d=apHash(xi+1,yi+1,seed);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }

  scatter(110,2.2,R,list=>inst(new THREE.DodecahedronGeometry(1,0), M2(L.rocks,{flatShading:true}), list, o=>({s:.5+o.r*1.8, y:.3, ry:o.r*6, rx:o.r})));
  { const list=[]; const ringR=half+58; for(let i=0;i<L.spireN;i++){ const a=i/L.spireN*Math.PI*2+apHash(i,5,seed)*.3; const rr=ringR+apHash(i,6,seed)*40; list.push({x:Math.cos(a)*rr,z:Math.sin(a)*rr,h:-2,r:apHash(i,7,seed)}); }
    inst(new THREE.ConeGeometry(9,42,5), M2(L.spire,{emissive:L.spire,emissiveIntensity:.08}), list, o=>({s:.7+o.r*1.3, sy:.8+o.r*1.4, y:18*(.8+o.r*1.4), ry:o.r*6})); }
  // ambient particles: a drifting field that follows the camera focus
  { const P=L.motes, N=P.n; const bg=new THREE.BufferGeometry(); const arr=new Float32Array(N*3); const vel=new Float32Array(N*3);
    for(let i=0;i<N;i++){ arr[i*3]=(Math.random()-.5)*110; arr[i*3+1]=Math.random()*30; arr[i*3+2]=(Math.random()-.5)*110; vel[i*3]=(Math.random()-.5)*.6; vel[i*3+1]=P.k==='ember'?1.5+Math.random()*2:P.k==='snow'?-(1.2+Math.random()*1.5):P.k==='ash'?-(.4+Math.random()*.6):(Math.random()-.5)*.5; vel[i*3+2]=(Math.random()-.5)*.6; }
    bg.setAttribute('position',new THREE.BufferAttribute(arr,3));
    const pm=new THREE.PointsMaterial({color:P.col,map:apSpriteTex(),size:P.k==='snow'?.7:P.k==='ember'?.5:.6,transparent:true,opacity:P.k==='dust'?.5:.75,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
    const pts=new THREE.Points(bg,pm); pts.frustumCulled=false; apLive(pts); _AP.particles={pts,vel,N,k:P.k,cx:0,cz:0}; }
  // biome-tinted fill light so the outer world reads in its own colour
  const fill=new THREE.HemisphereLight(L.hemi,0x000000,.22); apLive(fill);
}
// per-frame: drift particles around the camera focus, animate live scenery, wave the lava
function updateLandscape(dt){ _AP.t+=dt; const P=_AP.particles;
  let fx=0,fz=0; try{ const pl=(typeof _G!=='undefined')&&_G.players&&_G.players[0]; if(pl&&pl.player){ fx=pl.player.position.x; fz=pl.player.position.z; } }catch(_){}
  if(P){ const a=P.pts.geometry.attributes.position.array, v=P.vel, t=_AP.t;
    for(let i=0;i<P.N;i++){ const j=i*3; a[j]+=v[j]*dt+Math.sin(t*.7+i)*dt*(P.k==='snow'?.9:.4); a[j+1]+=v[j+1]*dt; a[j+2]+=v[j+2]*dt;
      if(P.k==='mote'||P.k==='spore'||P.k==='dust'){ a[j+1]+=Math.sin(t*.9+i*.3)*dt*.6; }
      let dx=a[j]-fx, dz=a[j+2]-fz; if(dx>55)a[j]-=110; else if(dx<-55)a[j]+=110; if(dz>55)a[j+2]-=110; else if(dz<-55)a[j+2]+=110;
      if(a[j+1]>30) a[j+1]=0; else if(a[j+1]<0) a[j+1]=30; }
    P.pts.geometry.attributes.position.needsUpdate=true; }
  for(const o of _AP.live){ if(o.userData&&o.userData.anim) apAnimateParts(o,dt); if(o.userData&&o.userData.lava){ o.material.emissiveIntensity=1.1+Math.sin(_AP.t*1.3)*.25; } }
  if(typeof G!=='undefined'){ for(const st of [G.stashStation,G.vendorStation,G.craftStation,G.yardStation,G.scoreStation,G.yardTerminal,G.portal]){ if(st&&st.mesh&&st.mesh.userData.anim) apAnimateParts(st.mesh,dt); }
    for(const list of [G.shrines,G.vistas,G.heroChallenges,G.pois,G.chests,G.townNpcs]){ if(!list) continue; for(const it of list){ const m=it&&it.mesh; if(m&&m.userData&&m.userData.anim) apAnimateParts(m,dt); } }
    if(G.scenery) for(const sc of G.scenery){ if(sc.userData&&sc.userData.anim) apAnimateParts(sc,dt); } }
}
// sanctuary dressing: lanterns, banners, planters, a fountain, crates — the hub looks lived-in

    const cloth=new THREE.Mesh(new THREE.BoxGeometry(.06,3.2,1.5), apM(0x7a1030,{ei:.3,r:.9})); cloth.position.set(0,4.6,.8); g.add(cloth); apAnim(g,{k:'sway',o:cloth,axis:'y',base:0,amp:.18,spd:1.7,ph:sd});
    const em=new THREE.Mesh(new THREE.OctahedronGeometry(.4,0), gold); em.scale.x=.2; em.position.set(0,4.6,.8); cloth.add(em); em.position.set(0,0,0);
    const fin=new THREE.Mesh(new THREE.ConeGeometry(.16,.5,5), gold); fin.position.y=7.2; g.add(fin); add(g,sd*6,-14); }
  // a fountain at the centre
  { const g=new THREE.Group(); const basin=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.5,.8,16), stone); basin.position.y=.4; g.add(basin);
    const water=new THREE.Mesh(new THREE.CylinderGeometry(2.9,2.9,.2,16), apM(0x3aa0d0,{ei:.5,r:.2,m:.3,t:true,op:.85})); water.position.y=.75; g.add(water);
    const col=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,2.4,8), stone); col.position.y=1.8; g.add(col);
    const bowl=new THREE.Mesh(new THREE.CylinderGeometry(1.3,.9,.4,12), stone); bowl.position.y=3.0; g.add(bowl);
    const jet=new THREE.Mesh(new THREE.ConeGeometry(.25,1.4,7), apM(0x9fe0ff,{ei:1.0,t:true,op:.7})); jet.position.y=3.9; g.add(jet); apAnim(g,{k:'breathe',o:jet,spd:6,amp:.12});
    const glow=new THREE.PointLight(0x56e0ff,.7,10); glow.position.y=2.5; g.add(glow); add(g,0,6); G.obstacles.push({x:0,z:6,r:3.6,h:1}); }
  // planters and crates
  for(const p of [[-20,12],[20,12],[-6,20],[6,20]]){ const g=new THREE.Group(); const pot=new THREE.Mesh(new THREE.CylinderGeometry(1.1,.9,.9,8), stone); pot.position.y=.45; g.add(pot);
    const bush=new THREE.Mesh(new THREE.SphereGeometry(1.1,7,6), green); bush.scale.y=.8; bush.position.y=1.3; g.add(bush); for(let i=0;i<4;i++){ const fl=new THREE.Mesh(new THREE.SphereGeometry(.14,5,4), apM([0xff5c78,0xffce4d,0xb06bff,0x56e0ff][i],{ei:.9})); fl.position.set(Math.cos(i*1.6)*.8,1.7,Math.sin(i*1.6)*.8); g.add(fl); } add(g,p[0],p[1]); G.obstacles.push({x:p[0],z:p[1],r:1.3,h:2}); }
  for(const p of [[19,5,.3],[21,7,1.1],[-19,6,.6]]){ const g=new THREE.Group(); const c=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.2,1.4), wood); c.position.y=.6; g.add(c); for(const sd of [-1,1]){ const b=new THREE.Mesh(new THREE.BoxGeometry(1.46,.12,.12), apM(0x3a3a40,{m:.6})); b.position.set(0,.6,sd*.6); g.add(b); } add(g,p[0],p[1],p[2]); }
  // rugs before the stations
  for(const p of [[-15,5,0xb06bff],[15,5,0x56e0ff]]){ const rug=new THREE.Mesh(new THREE.CircleGeometry(3.2,20), apM(p[2],{ei:.25,r:.95})); rug.rotation.x=-Math.PI/2; rug.position.set(p[0],.03,p[1]); scene.add(rug); G.scenery.push(rug); }

// ---- layout ----
const nav=document.getElementById('nav'); for(const v of ['heroes','bosses','pets','npcs','stations','props']) nav.innerHTML+='<a href="?view='+v+'">'+v+'</a>'; for(let i=0;i<6;i++) nav.innerHTML+='<a href="?view=land&biome='+i+'">land '+i+'</a>';
document.getElementById('lbl').textContent=view.toUpperCase()+(view==='land'?' · '+biome.name:'');
const spin=[]; let camY=14, camZ=16, look=[0,1.5,0];
function ground(){ const gm=apGroundMat(bi); const gg=new THREE.Mesh(apTileUV(new THREE.PlaneGeometry(90,60),90,60,8),gm); gg.rotation.x=-Math.PI/2; gg.receiveShadow=true; scene.add(gg); }
function place(m,x,z,ry){ m.position.set(x,0,z); if(ry!=null) m.rotation.y=ry; scene.add(m); return m; }
if(view==='heroes'){ ground(); const archs=['sword','daggers','bow','staff','wand','cannon','spear']; archs.forEach((a,i)=>{ const h=makeHeroMesh({arch:a,tint:[0x56e0ff,0xff5c78,0x6dff8c,0xffce4d][i%4]}); h.position.set((i-3)*3.2,1,0); h.rotation.y=.35; scene.add(h); spin.push(h); });
  const gh=makeHeroGhostMesh(); place(gh,12.5,0); camY=6; camZ=10; look=[0,1.6,0]; }
else if(view==='bosses'){ ground(); const keys=['warden','bombard','summoner','sweeper','twinfang','overlord','voidlord','warlock','reaper','towerlord']; const defs={warden:0xff3b5c,bombard:0xff9a3d,summoner:0xb06bff,sweeper:0x56e0ff,twinfang:0xffe14d,overlord:0xffffff,voidlord:0x9d7bff,warlock:0x56e0ff,reaper:0xff3b5c,towerlord:0xffce4d};
  keys.forEach((k,i)=>{ const s=k==='towerlord'?4.4:3; const m=makeBossMesh({key:k,color:defs[k]},s); m.position.set((i%5-2)*11,0,i<5?-8:6); m.userData.body.rotation.y=.3; scene.add(m); spin.push(m); }); camY=22; camZ=26; look=[0,3,-1]; }
else if(view==='pets'){ ground(); ['sprite','drake','golem','wisp','beast','imp'].forEach((f,i)=>{ for(let r=0;r<5;r+=2){ const m=makePetMesh(f,r); m.position.set((i-2.5)*3.4,1.2,(r/2-1)*3.2); m.rotation.y=.4; scene.add(m); spin.push(m); } });
  const sp=makeSpiritMesh(0x9be7ff,.55); place(sp,11,0,0); spin.push(sp); camY=7; camZ=10; look=[0,1,0]; }
else if(view==='npcs'){ ground(); const ids=[['wren',0x8effd9],['haldane',0xffce4d],['seravoss',0xb06bff],['cog',0x3aff8a],['mottle',0xff9a3d],['granny',0xff5470],['lumen',0xe8edf7],['echo',0x8aa0c0]]; ids.forEach((n,i)=>{ const m=makeNpcMesh({id:n[0],color:n[1]}); place(m,(i-3.5)*2.8,0,.3); spin.push(m); });
  const dm=makeDummyMesh(1.25); place(dm,12,0,0); camY=6; camZ=10; look=[0,1.5,0]; }
else if(view==='stations'){ biome=BIOMES[4]; ground(); ['stash','vendor','craft','yard','obelisk','terminal'].forEach((k,i)=>{ const m=makeStationMesh(k); place(m,(i-2.5)*9,0,0); spin.push(m); });
  const pg=new THREE.Group(); const ring=new THREE.Mesh(new THREE.TorusGeometry(2.4,.35,12,32), new THREE.MeshStandardMaterial({color:0x56e0ff,emissive:0x56e0ff,emissiveIntensity:1.5})); ring.rotation.x=Math.PI/2; ring.position.y=2.4; const beam=new THREE.Mesh(new THREE.CylinderGeometry(2,2,9,24,1,true), new THREE.MeshBasicMaterial({color:0x56e0ff,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false})); beam.position.y=4.5; pg.add(ring,beam); apPortalDress(pg,0x56e0ff); place(pg,0,-14); spin.push(pg);
  camY=16; camZ=22; look=[0,2.5,-3]; }
else if(view==='props'){ ground(); [apGlyphShrine(),apHubrisAltar(),apLever(),apVistaMarker(),apHeroTotem(),apWaymarker(),apChest(),apCampfire(),apCairn()].forEach((m,i)=>{ place(m,(i-4)*4.2,0,.2); spin.push(m); }); camY=8; camZ=13; look=[0,1.5,0]; }
else if(view==='land'){ // fake a 2-room floor with a corridor, then build the real floor + landscape around it
  const rooms=[{x0:-24,x1:6,z0:-16,z1:12},{x0:14,x1:44,z0:6,z1:30}]; const rects=rooms.concat([{x0:-3,x1:3.5,z0:-3.5,z1:20},{x0:-3,x1:20,z0:16,z1:22}]); G.rects=rects; G.rooms=rooms; G.bounds=140;
  const C=2, half=G.bounds/2+6, gw=Math.ceil(half*2/C), cells=new Uint8Array(gw*gw); const ox=-half, oz=-half;
  for(const r of rects){ for(let gx=0;gx<gw;gx++) for(let gz=0;gz<gw;gz++){ const cx=ox+(gx+.5)*C, cz=oz+(gz+.5)*C; if(cx>r.x0&&cx<r.x1&&cz>r.z0&&cz<r.z1) cells[gx*gw+gz]=1; } }
  G.grid={C,gw,gh:gw,ox,oz,cells};
  const gm=apGroundMat(bi); for(const r of rects){ const w=r.x1-r.x0+2.4, dd=r.z1-r.z0+2.4; const m=new THREE.Mesh(apTileUV(new THREE.PlaneGeometry(w,dd),w,dd,8),gm); m.rotation.x=-Math.PI/2; m.position.set((r.x0+r.x1)/2,0,(r.z0+r.z1)/2); m.receiveShadow=true; scene.add(m); }
  const wm=apWallMat(bi,biome); const H=3.7; const wl=[]; for(let gx=0;gx<gw;gx++) for(let gz=0;gz<gw;gz++){ if(!cells[gx*gw+gz]) continue; const cx=ox+(gx+.5)*C, cz=oz+(gz+.5)*C; const at=(a,b)=>(a>=0&&b>=0&&a<gw&&b<gw)?cells[a*gw+b]:0;
    if(!at(gx,gz-1)) wl.push([cx,cz-1,0]); if(!at(gx,gz+1)) wl.push([cx,cz+1,0]); if(!at(gx-1,gz)) wl.push([cx-1,cz,1]); if(!at(gx+1,gz)) wl.push([cx+1,cz,1]); }
  for(const w of wl){ const m=new THREE.Mesh(w[2]?new THREE.BoxGeometry(.7,H,C+.08):new THREE.BoxGeometry(C+.08,H,.7), wm); m.position.set(w[0],H/2,w[1]); m.castShadow=true; m.receiveShadow=true; scene.add(m); const tm=new THREE.Mesh(w[2]?new THREE.BoxGeometry(.78,.16,C+.1):new THREE.BoxGeometry(C+.1,.16,.78), new THREE.MeshStandardMaterial({color:biome.accent,emissive:biome.accent,emissiveIntensity:.5})); tm.position.set(w[0],H+.08,w[1]); scene.add(tm); }
  buildLandscape(); const h=makeHeroMesh({arch:'sword'}); h.position.set(-8,1,-2); scene.add(h); _G.players=[{player:h}];

  camY=28; camZ=15; look=[-8,1.2,-2]; camera.position.set(-8,28,13); }
camera.position.set(look[0],camY,look[2]+camZ); camera.lookAt(look[0],look[1],look[2]);
const clock=new THREE.Clock(); let frames=0;
renderer.setAnimationLoop(()=>{ const dt=Math.min(.05,clock.getDelta()); frames++; for(const m of spin){ apAnimateParts(m,dt); if(m.userData.hero) apAnimateHero(m,dt); } if(view==='land') updateLandscape(dt); renderer.render(scene,camera); window.__frames=frames; });
