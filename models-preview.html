// ---- shared humanoid rig. cfg: {skin, torsoR, torsoH, headY, hunch, armLen, legLen, armThick, buildHead} ----
function _rig(s,cfg){
  const grp=new THREE.Group(); grp.userData.humanoid=true; grp.userData.arms=[]; grp.userData.legs=[];
  const tR=cfg.torsoR||.3, tH=cfg.torsoH||.66, hunch=cfg.hunch||0;
  const body=new THREE.Mesh(new THREE.CylinderGeometry(tR*.8,tR,tH*s,7), cfg.skin);
  body.castShadow=true; body.position.y=.95*s; grp.add(body); grp.userData.body=body;
  // chest / belly mass
  const chest=new THREE.Mesh(new THREE.SphereGeometry(tR*1.05,9,7), cfg.skin); chest.scale.set(1,.85,.9); chest.position.set(0,tH*s*.28,hunch*.12*s); body.add(chest);
  // rounded back / hump for hunched brutes
  if(hunch>0.2){ const hump=new THREE.Mesh(new THREE.SphereGeometry(tR*.9,8,6), cfg.skin); hump.position.set(0,tH*s*.32,-hunch*.18*s); body.add(hump); }
  // neck + head (delegated)
  const head=new THREE.Group(); head.position.set(0,(cfg.headY||.5)*s,hunch*.22*s); body.add(head);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(tR*.35,tR*.4,.12*s,5), cfg.skin); neck.position.y=-.1*s; neck.rotation.x=hunch*.5; head.add(neck);
  if(cfg.buildHead) cfg.buildHead(head, s, cfg);
  // shoulders + arms
  const aL=cfg.armLen||.62, aTh=cfg.armThick||.06;
  for(const sd of [-1,1]){ const arm=new THREE.Group();
    const upper=_limb(s,aL*.52,aTh,aTh*.9,cfg.skin); upper.position.y=-aL*.26*s; arm.add(upper);
    const fore=_limb(s,aL*.5,aTh*.9,aTh*.8,cfg.skin); fore.position.y=-aL*.76*s; arm.add(fore);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(aTh*1.2*s,6,5), cfg.skin); hand.position.y=-aL*1.02*s; arm.add(hand);
    arm.position.set(sd*(tR+.02)*s,tH*s*.32,hunch*.1*s); arm.rotation.x=hunch*.6; body.add(arm); grp.userData.arms.push(arm); }
  // hips + legs
  const lL=cfg.legLen||.9, lTh=cfg.legThick||.07;
  for(const sd of [-1,1]){ const leg=new THREE.Group();
    const thigh=_limb(s,lL*.4,lTh,lTh*.85,cfg.skin); thigh.position.y=-lL*.2*s; leg.add(thigh);
    const shin=_limb(s,lL*.4,lTh*.85,lTh*.7,cfg.skin); shin.position.y=-lL*.58*s; leg.add(shin);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(.13*s,.07*s,.26*s), cfg.skin); foot.position.set(0,-lL*.8*s,.06*s); leg.add(foot);
    leg.position.set(sd*.13*s,-tH*s*.36,0); body.add(leg); grp.userData.legs.push(leg); }
  return grp;
}
function _put(body,o,s,x,y,z,rx,ry,rz){ o.position.set(x*s,y*s,z*s); if(rx)o.rotation.x=rx; if(ry)o.rotation.y=ry; if(rz)o.rotation.z=rz; body.add(o); return o; }

function apFacePet(pm,dt){ const u=pm.userData; const b=u.body; if(!b) return;

// ============================================================ ART PASS — WORLDS
// Tower-of-God rule: every floor is a real place, not a painted board. Each biome is a WORLD definition — its own
// sky (a fog-free gradient dome with a sun), sunlight colour, natural ground (grass / basalt / snow / void-glass /
// marble / ash with a worn path through the corridors), natural boundaries instead of neon-trimmed boxes (cliff
// boulders, basalt columns, ice blocks, void cliffs, marble balustrades, bone walls), a terrain that rolls away to
// mountains on the horizon, water or lava that actually moves, and weather in the air. Nothing here touches
// gameplay: the collision grid, spawns and pathing are untouched — the world is dressed around them.
// ---- value noise (seedable, deterministic) ----
function apHash(x,y,seed){ let h=(x*374761393 + y*668265263 + (seed||0)*974634121)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }

  const a=apHash(xi,yi,seed), b=apHash(xi+1,yi,seed), c=apHash(xi,yi+1,seed), d=apHash(xi+1,yi+1,seed);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }

    for(let i=0;i<P.N;i++){ const j=i*3; a[j]+=v[j]*dt+Math.sin(t*.7+i)*dt*(P.k==='snow'?.9:.4); a[j+1]+=v[j+1]*dt; a[j+2]+=v[j+2]*dt;
      if(P.k==='mote'||P.k==='spore'||P.k==='dust'){ a[j+1]+=Math.sin(t*.9+i*.3)*dt*.6; }

    P.pts.geometry.attributes.position.needsUpdate=true; }

  if(_AP.water&&_AP.water.material.map){ _AP.water.material.map.offset.x+=dt*.012; _AP.water.material.map.offset.y+=dt*.008; if(_AP.water.userData.rip2){ _AP.water.userData.rip2.offset.x-=dt*.009; _AP.water.userData.rip2.offset.y+=dt*.014; } if(_AP.foam&&_AP.foam.material.map){ _AP.foam.material.map.offset.x+=dt*.02; } if(_AP.water.userData.lava) _AP.water.material.emissiveIntensity=1.25+Math.sin(_AP.t*1.3)*.2; }

    if(G.scenery) for(const sc of G.scenery){ if(sc.userData&&sc.userData.anim) apAnimateParts(sc,dt); } }
