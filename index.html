<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOWERLORDS</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;color:#dfe8ff;font-family:system-ui,Segoe UI,Roboto,sans-serif;}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;}
  h1{font-size:clamp(28px,6vw,48px);letter-spacing:6px;margin:0 0 6px;color:#56e0ff;text-shadow:0 0 18px rgba(86,224,255,.6);}
  .sub{opacity:.6;letter-spacing:3px;font-size:12px;margin-bottom:32px;}
  .links{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
  a.btn{display:inline-block;min-width:200px;padding:14px 22px;border:1px solid #56e0ff;border-radius:10px;color:#56e0ff;text-decoration:none;font-weight:600;letter-spacing:2px;}
  a.btn:hover{background:#56e0ff;color:#05070d;box-shadow:0 0 22px rgba(86,224,255,.6);}
  .note{margin-top:28px;font-size:12px;opacity:.5;line-height:1.8;}
</style>
</head>
<body>
  <div>
    <h1>TOWERLORDS</h1>
    <div class="sub">CHOOSE YOUR BUILD</div>
    <div class="links">
      <a class="btn" href="towerlords.html">🖥 DESKTOP</a>
      <a class="btn" href="towerlords-mobile.html">📱 MOBILE</a>
      <a class="btn" href="towerlords-offline.html">⬇ OFFLINE</a>
    </div>
    <div class="note">
      Phones and tablets are sent to the mobile build automatically.<br>
      Add <code>?stay</code> to the address to keep this page.
    </div>
  </div>
<script>
(function(){
  if(location.search.indexOf('stay')>=0) return;
  var ua=navigator.userAgent||'';
  var touch=('ontouchstart' in window)||navigator.maxTouchPoints>1;
  var mobile=/Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua)||(touch&&Math.min(screen.width,screen.height)<900);
  location.replace(mobile?'towerlords-mobile.html':'towerlords.html');
})();
</script>
</body>
</html>
